apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-server-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/falbocodes/gitops-playground
    targetRevision: HEAD
    path: argocd/level-3/manifests/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: echo-server-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
